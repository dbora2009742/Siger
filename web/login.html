<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | SIGER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login">

    <!-- Marca -->
    <header class="marca">
      <img src="img/logo.png" alt="SIGER">
      <p>Sistema Integrado de Gestión de Residuos Sólidos</p>
    </header>

    <!-- Formulario -->
    <form class="formulario" action="#" method="post">
      <h1>INICIAR SESIÓN</h1>
      <p>Ingresa tus credenciales institucionales para acceder</p>

      <input type="text" name="identificador"
             placeholder="DNI o Correo institucional"
             aria-label="DNI o correo institucional"
             autocomplete="username" required>

      <input type="password" name="contrasena"
             placeholder="Contraseña"
             aria-label="Contraseña"
             autocomplete="current-password" required>

      <a href="#">¿Olvidaste tu contraseña?</a>

      <button type="submit">Ingresar</button>
    </form>

  </main>

</body>
</html>
